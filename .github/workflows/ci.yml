name: CI

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Current Home Assistant needs 3.13; on older Pythons pip resolves an old
      # release that lacks APIs the integration uses.
      - name: Run tests
        working-directory: custom_components
        run: >
          uv run --no-project -p 3.13 --with-requirements ../requirements_test.txt
          python -m unittest discover -s tests -t .

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS Action
        uses: hacs/action@22.5.0
        with:
          category: integration
