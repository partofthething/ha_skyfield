# Apache in front of `skyfield-sky serve --public` on 127.0.0.1:8100.
#
# The differences from the private vhost are the two that matter when other
# people are using it: what gets written down, and how much one caller may take.
#
#   sudo apt install libapache2-mod-qos libapache2-mod-evasive
#   sudo a2enmod proxy proxy_http headers reqtimeout qos evasive
#   sudo cp apache-skyfield-public.conf /etc/apache2/sites-available/skyfield-public.conf
#   sudo a2ensite skyfield-public && sudo systemctl reload apache2
#   sudo certbot --apache -d skyfield.partofthething.com

<VirtualHost *:443>
    ServerName skyfield.partofthething.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/skyfield.partofthething.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/skyfield.partofthething.com/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8100/ timeout=30 retry=5
    ProxyPassReverse / http://127.0.0.1:8100/

    <Location />
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Location>
    LimitRequestBody 1024
    RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500

    <LocationMatch "^/sky\.">
        Header set Cache-Control "public, max-age=600"
    </LocationMatch>

    # Callers say where they are in the query string, so `combined` would write
    # every visitor's coordinates into a file next to their IP address. %U is
    # the path without the query, and leaving out %h leaves out the address:
    # what is left says how much is being asked for, and nothing about whom.
    LogFormat "%t \"%m %U %H\" %>s %b %D" quiet
    CustomLog ${APACHE_LOG_DIR}/skyfield-public-access.log quiet
    ErrorLog  ${APACHE_LOG_DIR}/skyfield-public-error.log

    # Rate limiting, sized against what the server actually does: a chart it has
    # not drawn before costs about 20 ms, it draws one at a time behind a single
    # lock, and so it tops out near 50 a second no matter how many are asking.
    #
    # Ten thousand watches fetching twice a day is a quarter of a request a
    # second -- half a percent of that. The limits are not there for the
    # watches. They are there because one caller with a loop and a list of
    # coordinates can take the whole fifty, every request of it a cache miss.
    <IfModule mod_qos.c>
        # everyone together: comfortably above any real demand, comfortably
        # below the point where the lock is the only thing anybody is waiting on
        QS_LocRequestPerSecLimit /sky.pebble 20
        QS_LocRequestPerSecLimit /sky.svg 20
        QS_LocRequestPerSecLimit /sky.json 20
        # a picture is rasterised rather than written out, so it costs more than
        # the others; this one is a guess and worth timing before raising
        QS_LocRequestPerSecLimit /sky.png 5

        # a watch wants one connection and a browser a handful. Sixty-four at
        # once from one address is not a reader, and it is enough to hold the
        # server's whole capacity on its own
        QS_SrvMaxConnPerIP 4
    </IfModule>
</VirtualHost>

# Per-address burst limiting, which mod_qos above does not do -- its limits are
# for the location as a whole. mod_evasive's are per client, but its directives
# are server-wide, so on Debian they belong in
# /etc/apache2/mods-available/evasive.conf rather than here:
#
#   <IfModule mod_evasive20.c>
#       DOSHashTableSize  3097
#       DOSPageCount      5      # same URI, within DOSPageInterval seconds
#       DOSPageInterval   2
#       DOSSiteCount      20     # anything at all, within DOSSiteInterval
#       DOSSiteInterval   2
#       DOSBlockingPeriod 60     # then a minute of 403s
#       DOSLogDir         "/var/log/apache2/evasive"
#   </IfModule>
#
# A watch asks twice a day and a browser page asks once a minute, so neither
# comes anywhere near this. It is a loop that does.
