# Apache in front of `skyfield-sky serve`, which listens on 127.0.0.1:8099 and
# has no authentication of its own. This is the vhost for a server of your own;
# apache-skyfield-public.conf is the one for a server other people use.
#
#   sudo apt install libapache2-mod-qos          # or libapache2-mod-evasive
#   sudo a2enmod proxy proxy_http headers reqtimeout qos
#   sudo cp apache-skyfield.conf /etc/apache2/sites-available/skyfield.conf
#   sudo a2ensite skyfield && sudo systemctl reload apache2
#   sudo certbot --apache -d sky.example.com

<VirtualHost *:443>
    ServerName sky.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/sky.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sky.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8099/ timeout=30 retry=5
    ProxyPassReverse / http://127.0.0.1:8099/

    # nothing here is ever written to, so nothing but reading is allowed, and
    # a GET has no business carrying a body
    <Location />
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Location>
    LimitRequestBody 1024

    # the model behind every chart is cached for ten minutes (CACHE_SECONDS in
    # server.py), so saying so keeps a well-behaved client from asking again
    <LocationMatch "^/sky\.">
        Header set Cache-Control "public, max-age=600"
    </LocationMatch>

    # a slow-loris costs a thread, and this server has few of them
    RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500

    # Rate limiting. Drawing a chart is a tenth of a second of arithmetic, so
    # the point is only to keep one client from turning that into all of the
    # CPU. mod_qos delays rather than refuses, which a watch fetching twice a
    # day will never notice.
    <IfModule mod_qos.c>
        # everyone together, per location, per second
        QS_LocRequestPerSecLimit /sky.pebble 2
        QS_LocRequestPerSecLimit /sky.svg 2
        QS_LocRequestPerSecLimit /sky.json 2
        QS_LocRequestPerSecLimit /sky.png 1
        # one client, all at once: a browser opens a few, a loop opens many
        QS_SrvMaxConnPerIP 8
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/skyfield-error.log
    CustomLog ${APACHE_LOG_DIR}/skyfield-access.log combined
</VirtualHost>

# mod_evasive instead, if that is what is already installed. Its directives are
# server-wide rather than per-vhost, so on Debian they belong in
# /etc/apache2/mods-available/evasive.conf:
#
#   <IfModule mod_evasive20.c>
#       DOSHashTableSize  1024
#       DOSPageCount      5      # same URI, within DOSPageInterval seconds
#       DOSPageInterval   2
#       DOSSiteCount      30     # anything at all, within DOSSiteInterval
#       DOSSiteInterval   2
#       DOSBlockingPeriod 60     # then a minute of 403s
#       DOSLogDir         "/var/log/apache2/evasive"
#       # DOSWhitelist    192.168.1.*
#   </IfModule>
